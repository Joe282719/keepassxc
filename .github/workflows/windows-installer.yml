name: Windows installer

# MSVC + vcpkg build, matching the Windows steps in the project wiki:
# cmake -G Ninja with CMAKE_TOOLCHAIN_FILE pointing at vcpkg, Qt via
# CMAKE_PREFIX_PATH, then cpack generators ZIP and WIX (MSI).
# Qt itself is the prebuilt MSVC package. Building Qt inside vcpkg is optional
# in the docs and takes hours, so this job does not set WITH_BUILD_QT.

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - cursor/browser-urlless-entries-fedf

permissions:
  contents: read
  actions: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: C:\vcpkg
  # Keep in sync with builtin-baseline in vcpkg.json.
  VCPKG_BASELINE: 1600ce2ba1b6b621bfc5a31a785c4963b817a1c7
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  installer:
    name: Build MSI and portable ZIP
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows-latest is Windows Server 2025 with Visual Studio 2026.
      # The image also has the MSVC 14.44 toolset, which matches prebuilt Qt MSVC 2022 binaries.
      # Leave vsversion unset so vswhere -latest selects Visual Studio 2026.
      # Pin the 14.44 toolset, which the image installs for MSVC 2022 compatibility.
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.44"

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake")) {
            throw "vcpkg was not found at $env:VCPKG_ROOT"
          }
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          # Manifest mode checks out the baseline commit recorded in vcpkg.json.
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_BASELINE
          "$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      # Prebuilt Qt for the MSVC 2022 ABI. qtsvg and qttools are archives of the
      # desktop package in aqt 3, not add-on modules.
      - name: Install Qt
        shell: pwsh
        run: |
          py -3 -m pip install --disable-pip-version-check "aqtinstall==3.3.0"
          $dest = "C:\Qt"
          py -3 -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 `
            --outputdir $dest `
            --autodesktop `
            --archives qtbase qtsvg qttools qttranslations
          $qtRoot = Join-Path $dest "6.8.3\msvc2022_64"
          if (-not (Test-Path "$qtRoot\bin\windeployqt.exe")) {
            throw "windeployqt.exe was not found under $qtRoot"
          }
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$qtRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Qt installed at $qtRoot"

      - name: Locate WiX Toolset
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (-not $candle) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
              "$env:ProgramFiles\WiX Toolset v3.14\bin"
            )
            $found = $candidates | Where-Object { Test-Path "$_\candle.exe" } | Select-Object -First 1
            if (-not $found) { throw "candle.exe was not found. WiX Toolset 3.14 is required to build the MSI." }
            $found | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            Write-Host "WiX tools: $found"
          } else {
            Write-Host "WiX tools: $($candle.Source)"
          }

      - name: Configure
        shell: pwsh
        run: |
          if (-not $env:QT_ROOT_DIR) { throw "QT_ROOT_DIR was not set by the Qt install step" }
          Write-Host "cl: $((Get-Command cl).Source)"
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DKEEPASSXC_BUILD_TYPE=Snapshot `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DX_VCPKG_APPLOCAL_DEPS_INSTALL=ON `
            -DWITH_TESTS=OFF `
            -DWITH_GUI_TESTS=OFF `
            -DKPXC_FEATURE_DOCS=OFF `
            -DKPXC_FEATURE_BROWSER=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Package MSI and portable ZIP
        shell: pwsh
        run: cmake --build build --target package

      - name: Show package files
        shell: pwsh
        run: Get-ChildItem build -File | Where-Object { $_.Extension -in '.msi', '.zip' } | Format-Table Name, Length

      - name: Upload Windows installer (MSI)
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-Windows-MSI
          path: build/*.msi
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KeePassXC-Windows-Portable-ZIP
          path: build/*.zip
          if-no-files-found: error

      - name: Upload configure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          if-no-files-found: ignore
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
